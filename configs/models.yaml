# Inspired by https://artificialanalysis.ai/methodology/intelligence-benchmarking#general-testing-parameters
# Unlike AA, we cap reasoning output at 32K instead of each model's disclosed maximum.
# Temperature: 0 without thinking, 0.6 with thinking; lab recommendations override defaults.
# Sampling: follow lab guidance; otherwise top-p 1, no top-k or repetition penalty.
# Output: 32K with thinking, 16K otherwise; Qwen4B variants share 32K to isolate thinking.
# Context: output budget + 8K for input. Verify actual prompt lengths before full runs.
# Seed: 42 for all models. Token budgets are evaluation policy, not model limits.
# Requests: generation deadlines set per model below; no model-call retries.
# Sample errors: one retry, then score missing answers as incorrect and continue.
# Keep failed samples in the denominator. Retry policy lives in evaluation.py.

smollm3-3b:
  model_name: HuggingFaceTB/SmolLM3-3B
  gpu: A100
  volume_prefix: amalia
  thinking:
    enabled: true
    template_configurable: true
  generation:
    timeout: 120
    max_retries: 0
    temperature: 0.6 # HF recommendation.
    top_p: 0.95 # HF recommendation.
    max_tokens: 32768
    seed: 42
    max_connections: 32
    stop_sequences:
      - "</s>"
      - "<|im_end|>"
      - "<|endoftext|>"
  model_args:
    revision: a07cc9a04f16550a088caea529712d1d335b0ac1
    gpu_memory_utilization: 0.9
    max_num_seqs: 32
    tensor_parallel_size: 1
    generation_config: vllm
    max_model_len: 40960

