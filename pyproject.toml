[project]
name = "amelia-evals"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "datasets>=5.0.1",
    "inspect-ai>=0.3.261",
    "modal>=1.3.5",
    "openai>=3.8.0",
    "pydantic>=2.13.5",
    "pyyaml>=6.0.3",
]

[build-system]
requires = ["uv_build>=0.12.1,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pytest-xdist>=3.8.0",
    "ruff>=0.16.5",
    "ty>=0.0.78",
]

[tool.ty.src]
include = ["src"]
exclude = [".venv", ".git", "__pycache__", ".pytest_cache", ".ruff_cache"]

[tool.ruff]
extend-exclude = [".venv/", "notebooks/", "scripts", "reports/", "dashboards/", "frontend/", "config/legacy/"]

[tool.ruff.lint]
ignore = ["COM812"]
extend-select = [
    "F",
    "W",
    "E",
    "I",
    "UP",
    "C4",
    "C901",
    "COM",
    "DTZ",
    "FBT",
    "N",
    "B",
    "FA",
    "ISC",
    "ICN",
    "RET",
    "SIM",
    "TID",
    "TC",
    "PTH",
    "PERF",
    "TD",
    "NPY",
]

[tool.ruff.lint.mccabe]
max-complexity = 10
